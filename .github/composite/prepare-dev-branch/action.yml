name: 🧩 Prepare Dev Branch

inputs:
  github-token:
    description: Github token
    required: true

runs:
  using: 'composite'
  steps:
    - name: 📘 Prepare Dev Branch · Build GitHub Pages (Storybook)
      shell: bash
      run: npx ng run acl:build-storybook

    - name: 🔎 Prepare Dev Branch · Git Status
      shell: bash
      run: git status --short

    - name: 💾 Prepare Dev Branch · Commit Generated Assets
      shell: bash
      id: commit_assets
      if: github.event_name == 'pull_request'
      run: |
        set -e

        if git diff --quiet; then
          echo "no_changes=true" >> "$GITHUB_OUTPUT"
          echo "No changes detected, skipping commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add -A
        git commit -m "🤖 github: update generated assets"
        git push origin HEAD:${{ github.head_ref }}

        echo "no_changes=false" >> "$GITHUB_OUTPUT"
