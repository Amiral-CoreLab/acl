name: 🧩 Prepare Dev Branch

inputs:
  github-token:
    description: Github token
    required: true

runs:
  using: 'composite'
  steps:
    - name: 📘 Prepare Dev Branch · Build GitHub Pages (Storybook)
      shell: bash
      run: npx ng run acl:build-storybook

    - name: 🔎 Prepare Dev Branch · Git Status
      shell: bash
      run: git status --short

    - name: 💾 Prepare Dev Branch · Commit Generated Assets
      shell: bash
      id: commit_assets
      if: github.event_name == 'pull_request'
      run: |
        if git diff --quiet; then
          echo "no_changes=true" >> $GITHUB_OUTPUT
          echo "No changes detected, skipping commit."
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 github : update Figma assets"
          git push origin HEAD:${{ github.head_ref }}
          echo "no_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: 🔁 Prepare Dev Branch · Trigger CI Re-run
      shell: bash
      if: github.event_name == 'pull_request' && steps.commit_assets.outputs.no_changes == 'false'
      env:
        WORKFLOW_ID: ci-pr-dev.yml
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "Triggering CI re-run on ref ${{ github.head_ref }} ..."

        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/dispatches" \
          -d "{\"ref\":\"${{ github.head_ref }}\"}"

    - name: ⏱️ Prepare Dev Branch · Wait for CI Completion
      shell: bash
      if: github.event_name == 'pull_request' && steps.commit_assets.outputs.no_changes == 'false'
      env:
        WORKFLOW_ID: ci-pr-dev.yml
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: npx tsx tools/prepare-dev-branch/wait
