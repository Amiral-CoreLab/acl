name: ci-pr-dev

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  pre-lint:
    name: 🔍 Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run acl:lint

      - name: 🎨 Run Stylelint
        run: npm run acl:lint-styles



  build:
    name: 🛠️ Build Library
    needs: pre-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧱 Build Angular Library
        run: npm run acl:build

  build-and-test:
    name: 🛠️ Test
    runs-on: ubuntu-latest
    needs: build
    environment: Figma
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🖥️ Start Storybook Server
        run: npm run acl:storybook &

      - name: ⏳ Wait for Storybook Startup
        env:
          URL: http://localhost:6006
        run: npm run ci:wait-on

      - name: 🎨 Fetch Figma Icons
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_FILE_SPEC_NODE_ID: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}
        run: npm run tools:figma-icon

      - name: 🎨 Fetch Figma Colors
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_FILE_SPEC_NODE_ID: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}
        run: npm run tools:figma-color

      - name: 🎨 Fetch Figma Components
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_FILE_SPEC_NODE_ID: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}
        run: npm run tools:figma-component

      - name: 🧪 Validate Figma Specs (Snapshot checks)
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_FILE_SPEC_NODE_ID: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}
        run: npm run tools:figma-spec

      - name: 🔎 Show changed files
        run: git status --short


      - name: 💾 Commit Generated Figma Assets
        id: commit_assets
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "🤖 github : update Figma assets"
            git push origin HEAD:${{ github.head_ref }}
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔁 Trigger CI rerun
        if: github.event_name == 'pull_request' && steps.commit_assets.outputs.no_changes == 'false'
        env:
          WORKFLOW_ID: ci-pr-dev.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering CI re-run on ref ${{ github.head_ref }} ..."

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/dispatches" \
            -d "{\"ref\":\"${{ github.head_ref }}\"}"

      - name: ⏱️ Wait for rerun to complete
        if: github.event_name == 'pull_request' && steps.commit_assets.outputs.no_changes == 'false'
        env:
          WORKFLOW_ID: ci-pr-dev.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run ci:rerun
