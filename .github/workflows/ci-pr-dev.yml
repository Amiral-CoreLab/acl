name: ci-pr-dev

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-pr-dev-${{ github.head_ref || github.ref_name }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  npm-audit:
    timeout-minutes: 10
    name: 🔐 NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/npm-audit

  linting:
    timeout-minutes: 10
    needs: npm-audit
    name: 🔍 Linting
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/linting

  tests:
    timeout-minutes: 10
    needs: npm-audit
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/tests

  build:
    timeout-minutes: 10
    needs: npm-audit
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/build

  figma:
    timeout-minutes: 60
    needs: [ linting, tests, build ]
    name: 🧑‍🎨 Figma
    runs-on: ubuntu-latest
    environment: figma
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/figma
        with:
          figma-access-token: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          figma-file-key: ${{ secrets.FIGMA_FILE_KEY }}
          figma-spec-node-id: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}
      - uses: ./.github/composite/artifact-figma-upload

  visual-regression:
    timeout-minutes: 30
    needs: figma
    name: 👀 Visual Regression
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/artifact-figma-download
      - uses: ./.github/composite/artifact-figma-setup
      - uses: ./.github/composite/visual-regression
      - uses: ./.github/composite/artifact-visual-regression-upload

  prepare-dev-branch:
    timeout-minutes: 10
    needs: visual-regression
    name: 🧩 Prepare Dev Branch
    runs-on: ubuntu-latest
    environment: visual-regression
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/artifact-figma-download
      - uses: ./.github/composite/artifact-figma-setup
      - uses: ./.github/composite/artifact-visual-regression-download
      - uses: ./.github/composite/artifact-visual-regression-setup
        with:
          warn: ${{ vars.VISUAL_REGRESSION_WARN }}
          alert: ${{ vars.VISUAL_REGRESSION_ALERT }}
      - uses: ./.github/composite/prepare-dev-branch
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    timeout-minutes: 30
    needs: prepare-dev-branch
    name: 🛡️ Quality Gate
    runs-on: ubuntu-latest
    environment: visual-regression
    steps:
      - name: 📥 Workspace Setup · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/composite/workspace-setup
      - uses: ./.github/composite/linting
      - uses: ./.github/composite/tests
      - uses: ./.github/composite/build
      - uses: ./.github/composite/quality-gate
        with:
          warn: ${{ vars.VISUAL_REGRESSION_WARN }}
          alert: ${{ vars.VISUAL_REGRESSION_ALERT }}
