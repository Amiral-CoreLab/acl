name: CI - DEV

on:
  pull_request:
    branches:
      - dev

jobs:
  install:
    name: 🧱 Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟦 Setup Node.js LTS (cache npm)
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

  pre-lint:
    name: 🧱 Install dependencies
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟦 Setup Node.js LTS (cache npm)
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 🧹 Run ESLint
        run: npm run acl:lint

      - name: 🎨 Run Stylelint
        run: npm run acl:lint-styles
