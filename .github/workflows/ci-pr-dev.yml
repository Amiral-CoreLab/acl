name: CI - DEV

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  pre-lint:
    name: 🔍 Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run acl:lint

      - name: 🎨 Run Stylelint
        run: npm run acl:lint-styles



  build:
    name: 🛠️ Build Library
    needs: pre-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧱 Build Angular Library
        run: npm run acl:build

  build-and-test:
    name: 🛠️ Test
    runs-on: ubuntu-latest
    needs: build
    environment: Figma
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
      FIGMA_FILE_SPEC_NODE_ID: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🖥️ Start Storybook Server
        run: npm run acl:storybook &

      - name: ⏳ Wait for Storybook Startup
        run: npx wait-on http://localhost:6006

      - name: 🎨 Fetch Figma Icons
        run: npm run tools:figma-icon

      - name: 🎨 Fetch Figma Colors
        run: npm run tools:figma-color

      - name: 🎨 Fetch Figma Components
        run: npm run tools:figma-component

      - name: 🧪 Validate Figma Specs (Snapshot checks)
        run: npm run tools:figma-spec

      - name: 🔎 Show changed files
        run: git status --short

      - name: 💾 Commit Generated Figma Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update Figma-generated assets" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref }}
