name: CI - DEV

on:
  pull_request:
    branches:
      - dev

jobs:
  install:
    name: 🧱 Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟦 Setup Node.js LTS (cache npm)
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

  pre-lint:
    name: 🔍 Lint Codebase
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟦 Setup Node.js LTS (cache npm)
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run acl:lint

      - name: 🎨 Run Stylelint
        run: npm run acl:lint-styles

  build-and-test:
    runs-on: ubuntu-latest
    needs: install
    environment: Figma

    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
      FIGMA_FILE_SPEC_NODE_ID: ${{ secrets.FIGMA_FILE_SPEC_NODE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Prepare Storybook
        run: npm run acl:storybook &

      - name: Wait for Storybook
        run: npx wait-on http://localhost:6006

      - name: Run tests + API scripts
        run: npm run ci:check
